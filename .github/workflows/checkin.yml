name: Auto Checkin

on:
  schedule:
    - cron: '53 2 * * *'
    - cron: '55 4 * * *'
    - cron: '55 6 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run Checkin
        env:
          CHECKIN_SITES: ${{ secrets.CHECKIN_SITES }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          const https = require('https');

          const SITES = JSON.parse(process.env.CHECKIN_SITES || '[]');
          const SERVERCHAN_KEY = process.env.SERVERCHAN_KEY || '';

          async function sendNotification(title, content) {
            if (!SERVERCHAN_KEY) return;
            return new Promise((resolve) => {
              try {
                const postData = `title=${encodeURIComponent(title)}&desp=${encodeURIComponent(content)}`;
                const req = https.request({
                  hostname: 'sctapi.ftqq.com',
                  path: `/${SERVERCHAN_KEY}.send`,
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Content-Length': Buffer.byteLength(postData)
                  }
                }, () => resolve());
                req.on('error', () => resolve());
                req.write(postData);
                req.end();
                console.log('📨 微信通知已发送');
              } catch(e) {
                console.log('📨 通知发送失败:', e.message);
                resolve();
              }
            });
          }

          // ===== 原有逻辑（旧版 New API，localStorage 存 user）=====
          async function checkinSite(browser, site) {
            console.log(`\n📌 [${site.name}] ${site.username}`);
            try {
              const context = await browser.newContext({
                viewport: { width: 1920, height: 1080 },
                locale: 'zh-CN',
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                extraHTTPHeaders: { 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8' }
              });

              const page = await context.newPage();
              await page.goto(site.url + '/login', { timeout: 60000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);

              const title = await page.title();
              if (title.includes('Just a moment')) {
                console.log('⚠️ Cloudflare 验证中，等待...');
                await page.waitForTimeout(15000);
              }

              const emailInput = await page.$('input[type="email"]');
              const userInput = await page.$('input[placeholder*="邮箱"], input[placeholder*="账号"], input[placeholder*="用户名"], input[name="username"]');
              const passInput = await page.$('input[type="password"]');

              if (emailInput) await emailInput.fill(site.username);
              else if (userInput) await userInput.fill(site.username);
              if (passInput) await passInput.fill(site.password);

              await page.waitForTimeout(1000);

              try {
                const semiCheckbox = await page.$('.semi-checkbox');
                if (semiCheckbox) {
                  await semiCheckbox.click();
                  console.log('☑️ 已勾选用户协议（semi）');
                } else {
                  const checkbox = await page.$('input[type="checkbox"]');
                  if (checkbox) {
                    const checked = await checkbox.isChecked();
                    if (!checked) {
                      await checkbox.click();
                      console.log('☑️ 已勾选用户协议');
                    }
                  }
                }
              } catch(e) {}

              await page.waitForTimeout(1000);

              try {
                const submitBtn = await page.waitForSelector('button[type="submit"]:not([disabled])', { timeout: 15000 });
                await submitBtn.click();
                console.log('🔄 点击登录...');
              } catch(e) {
                const submitBtn = await page.$('button[type="submit"]');
                if (submitBtn) await submitBtn.click();
                console.log('🔄 点击登录（强制）...');
              }

              await page.waitForTimeout(8000);

              const userInfo = await page.evaluate(() => {
                try {
                  const user = localStorage.getItem('user');
                  return user ? JSON.parse(user) : null;
                } catch(e) { return null; }
              });

              if (!userInfo?.id) {
                console.log(`❌❌❌ [${site.name}] ${site.username} 登录失败`);
                await context.close();
                return { name: site.name, username: site.username, ok: false, msg: '登录失败', balance: '' };
              }

              console.log(`✅ 用户ID: ${userInfo.id}`);

              const response = await page.evaluate(async (userId) => {
                try {
                  const headers = userId ? { 'New-Api-User': String(userId) } : {};
                  const res = await fetch('/api/user/checkin', { method: 'POST', headers });
                  return await res.json();
                } catch(e) { return { error: e.toString() }; }
              }, userInfo?.id);

              const msg = response.message || response.msg || JSON.stringify(response);
              const checkinOk = response.success || msg.includes('成功') || msg.includes('已签到');

              if (checkinOk) {
                console.log(`✅ [${site.name}] ${site.username} 签到: ${msg}`);
              } else {
                console.log(`❌❌❌ [${site.name}] ${site.username} 签到失败: ${msg}`);
              }

              await page.waitForTimeout(3000);

              const selfInfo = await page.evaluate(async (userId) => {
                try {
                  const headers = userId ? { 'New-Api-User': String(userId) } : {};
                  const res = await fetch('/api/user/self', { method: 'GET', headers });
                  return await res.json();
                } catch(e) { return { error: e.toString() }; }
              }, userInfo?.id);

              let balanceStr = '';
              if (selfInfo?.data) {
                const quota = selfInfo.data.quota ?? selfInfo.data.balance ?? null;
                if (quota !== null) {
                  const rate = site.rate || 500000;
                  const unit = site.unit || '$';
                  const balance = (quota / rate).toFixed(4);
                  balanceStr = `${unit}${balance}`;
                  console.log(`💰 余额: ${balanceStr}`);
                }
              }

              await context.close();
              return { name: site.name, username: site.username, ok: checkinOk, msg, balance: balanceStr };
            } catch(e) {
              console.log(`❌❌❌ [${site.name}] ${site.username} 异常: ${e.message}`);
              return { name: site.name, username: site.username, ok: false, msg: e.message, balance: '' };
            }
          }

          // ===== 新版 New API（sign-in 页面，Cookie + New-Api-User 鉴权）=====
          async function checkinSiteNewStyle(browser, site) {
            console.log(`\n📌 [NEW] [${site.name}] ${site.username}`);
            try {
              const context = await browser.newContext({
                viewport: { width: 1920, height: 1080 },
                locale: 'zh-CN',
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                extraHTTPHeaders: { 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8' }
              });

              const page = await context.newPage();
              await page.goto(site.url + '/sign-in', { timeout: 60000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);

              const title = await page.title();
              if (title.includes('Just a moment')) {
                console.log('⚠️ Cloudflare 验证中，等待...');
                await page.waitForTimeout(15000);
              }

              // 填写账号密码
              const emailInput = await page.$('input[type="email"]');
              const userInput = await page.$('input[placeholder*="邮箱"], input[placeholder*="账号"], input[placeholder*="用户名"], input[name="username"], input[name="email"]');
              const passInput = await page.$('input[type="password"]');

              if (emailInput) await emailInput.fill(site.username);
              else if (userInput) await userInput.fill(site.username);
              if (passInput) await passInput.fill(site.password);

              await page.waitForTimeout(1000);

              // ===== 强力多策略勾选协议 =====
              // 哈基米等新版站点协议框可能是自定义组件，需要多策略兜底
              const checkboxClicked = await page.evaluate(() => {
                // 策略1: 标准 input[type="checkbox"]
                const inputs = document.querySelectorAll('input[type="checkbox"]');
                for (const cb of inputs) {
                  if (!cb.checked) {
                    cb.click();
                    // 触发 React/Vue 的合成事件
                    cb.dispatchEvent(new Event('change', { bubbles: true }));
                    cb.dispatchEvent(new Event('input', { bubbles: true }));
                  }
                }
                if (inputs.length > 0) return 'input-checkbox';

                // 策略2: semi-checkbox 组件 (Semi UI)
                const semiCbs = document.querySelectorAll('.semi-checkbox, .semi-checkbox-inner, [class*="semi-checkbox"]');
                if (semiCbs.length > 0) {
                  semiCbs[0].click();
                  return 'semi-checkbox';
                }

                // 策略3: role="checkbox" 的任意元素
                const roleCbs = document.querySelectorAll('[role="checkbox"]');
                if (roleCbs.length > 0) {
                  roleCbs[0].click();
                  roleCbs[0].dispatchEvent(new MouseEvent('click', { bubbles: true }));
                  return 'role-checkbox';
                }

                // 策略4: 含"协议"或"用户"文字的可点击区域（label/span/div）
                const allEls = document.querySelectorAll('label, span, div');
                for (const el of allEls) {
                  if ((el.textContent.includes('协议') || el.textContent.includes('用户') || el.textContent.includes('同意'))
                      && el.offsetWidth > 0 && el.offsetWidth < 300) {
                    el.click();
                    return 'text-label';
                  }
                }

                return 'none';
              });
              console.log(`☑️ 协议勾选策略: ${checkboxClicked}`);

              // 额外等待一下，让 React 状态更新
              await page.waitForTimeout(1500);

              // 如果上面用 JS 点击不够，再用 Playwright 原生 click 兜底
              if (checkboxClicked === 'none' || checkboxClicked === 'input-checkbox') {
                try {
                  // 尝试点击包含协议文字的 label 或其前面的圆圈
                  const agreeLabel = await page.$('label:has-text("协议"), label:has-text("同意"), label:has-text("用户")');
                  if (agreeLabel) {
                    await agreeLabel.click({ force: true });
                    console.log('☑️ 已点击协议 label（Playwright）');
                  }
                } catch(e) {}
              }

              await page.waitForTimeout(1000);

              // ===== 点击登录按钮，多策略兜底 =====
              let loginClicked = false;

              // 策略1: 等待非 disabled 的 submit 按钮
              try {
                const submitBtn = await page.waitForSelector('button[type="submit"]:not([disabled])', { timeout: 8000 });
                await submitBtn.click();
                console.log('🔄 点击登录（submit 非禁用）...');
                loginClicked = true;
              } catch(e) {}

              // 策略2: 强制点击 submit 按钮（即使 disabled）
              if (!loginClicked) {
                try {
                  const submitBtn = await page.$('button[type="submit"]');
                  if (submitBtn) {
                    await submitBtn.click({ force: true });
                    console.log('🔄 点击登录（submit 强制）...');
                    loginClicked = true;
                  }
                } catch(e) {}
              }

              // 策略3: 通过文字找按钮
              if (!loginClicked) {
                try {
                  const loginBtn = await page.$('button:has-text("登录"), button:has-text("继续"), button:has-text("Login")');
                  if (loginBtn) {
                    await loginBtn.click({ force: true });
                    console.log('🔄 点击登录（文字按钮）...');
                    loginClicked = true;
                  }
                } catch(e) {}
              }

              // 策略4: JS 直接提交表单
              if (!loginClicked) {
                await page.evaluate(() => {
                  const btn = document.querySelector('button[type="submit"]') ||
                              document.querySelector('button');
                  if (btn) btn.click();
                });
                console.log('🔄 点击登录（JS click）...');
              }

              await page.waitForTimeout(8000);

              // 新版通过 API 获取当前用户信息（Cookie 自动携带）
              const selfInfo = await page.evaluate(async () => {
                try {
                  const res = await fetch('/api/user/self', { method: 'GET' });
                  return await res.json();
                } catch(e) { return { error: e.toString() }; }
              });

              if (!selfInfo?.data?.id) {
                // 兜底：尝试从 localStorage 读取（部分站点混用）
                const userFromStorage = await page.evaluate(() => {
                  try {
                    const u = localStorage.getItem('user');
                    return u ? JSON.parse(u) : null;
                  } catch(e) { return null; }
                });
                if (!userFromStorage?.id) {
                  console.log(`❌❌❌ [${site.name}] ${site.username} 登录失败，未获取到用户信息`);
                  console.log(`  selfInfo: ${JSON.stringify(selfInfo)}`);
                  await context.close();
                  return { name: site.name, username: site.username, ok: false, msg: '登录失败', balance: '' };
                }
                // 如果 localStorage 有数据，转交旧逻辑处理
                console.log(`✅ 用户ID（localStorage 兜底）: ${userFromStorage.id}`);
                const fbUserId = userFromStorage.id;
                // 先尝试 sign_in，兜底 checkin
                let fbResp = await page.evaluate(async (uid) => {
                  try {
                    const res = await fetch('/api/user/sign_in', { method: 'POST', headers: { 'New-Api-User': String(uid) } });
                    return await res.json();
                  } catch(e) { return { error: e.toString() }; }
                }, fbUserId);
                if (fbResp.error || fbResp.message === 'not found' || fbResp.status === 404) {
                  fbResp = await page.evaluate(async (uid) => {
                    try {
                      const res = await fetch('/api/user/checkin', { method: 'POST', headers: { 'New-Api-User': String(uid) } });
                      return await res.json();
                    } catch(e) { return { error: e.toString() }; }
                  }, fbUserId);
                }
                const fbMsg = fbResp.message || fbResp.msg || JSON.stringify(fbResp);
                const fbOk = fbResp.success || fbMsg.includes('成功') || fbMsg.includes('已签到') || fbMsg.includes('sign');
                if (fbOk) console.log(`✅ [${site.name}] ${site.username} 签到: ${fbMsg}`);
                else console.log(`❌❌❌ [${site.name}] ${site.username} 签到失败: ${fbMsg}`);
                // 查余额
                await page.waitForTimeout(2000);
                const fbSelf = await page.evaluate(async (uid) => {
                  try {
                    const res = await fetch('/api/user/self', { method: 'GET', headers: { 'New-Api-User': String(uid) } });
                    return await res.json();
                  } catch(e) { return { error: e.toString() }; }
                }, fbUserId);
                let fbBalance = '';
                if (fbSelf?.data) {
                  const d = fbSelf.data;
                  if (site.currency === 'CNY') {
                    const recharge = (d.quota ?? 0) / 10;
                    const gift = (d.aff_quota ?? d.gift_amount ?? d.group_quota ?? 0) / 10;
                    const total = recharge + gift;
                    fbBalance = gift > 0
                      ? `¥${total.toFixed(2)}（充值¥${recharge.toFixed(2)}+积分¥${gift.toFixed(2)}）`
                      : `¥${recharge.toFixed(2)}`;
                  } else if (site.rate) {
                    const quota = d.quota ?? d.balance ?? null;
                    if (quota !== null) fbBalance = `${site.unit || '$'}${(quota / site.rate).toFixed(4)}`;
                  } else {
                    const quota = d.quota ?? d.balance ?? null;
                    if (quota !== null) {
                      if (quota > 1000000) {
                        const recharge = quota / 10;
                        const gift = (d.aff_quota ?? d.gift_amount ?? d.group_quota ?? 0) / 10;
                        const total = recharge + gift;
                        fbBalance = gift > 0
                          ? `¥${total.toFixed(2)}（充值¥${recharge.toFixed(2)}+积分¥${gift.toFixed(2)}）`
                          : `¥${recharge.toFixed(2)}`;
                      } else {
                        fbBalance = `$${(quota / 500000).toFixed(4)}`;
                      }
                    }
                  }
                  if (fbBalance) console.log(`💰 余额: ${fbBalance}`);
                }
                await context.close();
                return { name: site.name, username: site.username, ok: fbOk, msg: fbMsg, balance: fbBalance };
              }

              const userId = selfInfo.data.id;
              console.log(`✅ 用户ID: ${userId}`);

              // 新版签到接口为 /api/user/sign_in，同时兜底 /api/user/checkin
              let response = await page.evaluate(async (uid) => {
                try {
                  const res = await fetch('/api/user/sign_in', {
                    method: 'POST',
                    headers: { 'New-Api-User': String(uid) }
                  });
                  return await res.json();
                } catch(e) { return { error: e.toString() }; }
              }, userId);

              // 如果 sign_in 不存在，尝试 checkin
              if (response.error || response.message === 'not found' || response.status === 404) {
                console.log('⚠️ sign_in 接口无效，尝试 checkin 接口...');
                response = await page.evaluate(async (uid) => {
                  try {
                    const headers = uid ? { 'New-Api-User': String(uid) } : {};
                    const res = await fetch('/api/user/checkin', { method: 'POST', headers });
                    return await res.json();
                  } catch(e) { return { error: e.toString() }; }
                }, userId);
              }

              const msg = response.message || response.msg || JSON.stringify(response);
              const checkinOk = response.success || msg.includes('成功') || msg.includes('已签到') || msg.includes('sign');

              if (checkinOk) {
                console.log(`✅ [${site.name}] ${site.username} 签到: ${msg}`);
              } else {
                console.log(`❌❌❌ [${site.name}] ${site.username} 签到失败: ${msg}`);
              }

              await page.waitForTimeout(3000);

              const selfInfoAfter = await page.evaluate(async (uid) => {
                try {
                  const res = await fetch('/api/user/self', {
                    method: 'GET',
                    headers: { 'New-Api-User': String(uid) }
                  });
                  return await res.json();
                } catch(e) { return { error: e.toString() }; }
              }, userId);

              let balanceStr = '';
              if (selfInfoAfter?.data) {
                const d = selfInfoAfter.data;
                // 新版站（人民币元）：quota 字段单位是"分"，除以 10 得到元
                // 同时区分充值额度(quota)和积分/赠送额度(aff_quota / gift_amount / group_quota)
                // 旧版站（美元）：quota 除以 rate(500000) 得到美元
                if (site.currency === 'CNY') {
                  // 强制人民币模式：直接按元显示，同时拆分充值+积分
                  const recharge = (d.quota ?? 0) / 10;          // 充值额度（元）
                  const gift     = (d.aff_quota ?? d.gift_amount ?? d.group_quota ?? 0) / 10; // 积分/赠送额度（元）
                  const total    = recharge + gift;
                  balanceStr = `¥${total.toFixed(2)}（充值¥${recharge.toFixed(2)}+积分¥${gift.toFixed(2)}）`;
                  console.log(`💰 余额: ${balanceStr}`);
                } else if (site.rate) {
                  // 明确指定了换算率：按旧逻辑换算
                  const quota = d.quota ?? d.balance ?? null;
                  if (quota !== null) {
                    const unit = site.unit || '$';
                    const balance = (quota / site.rate).toFixed(4);
                    balanceStr = `${unit}${balance}`;
                    console.log(`💰 余额: ${balanceStr}`);
                  }
                } else {
                  // 自动探测：如果 quota 数值超大（>1000000），大概率是分为单位的人民币
                  const quota = d.quota ?? d.balance ?? null;
                  if (quota !== null) {
                    if (quota > 1000000) {
                      // 按人民币元处理，同时尝试读积分字段
                      const recharge = quota / 10;
                      const gift = (d.aff_quota ?? d.gift_amount ?? d.group_quota ?? 0) / 10;
                      const total = recharge + gift;
                      balanceStr = gift > 0
                        ? `¥${total.toFixed(2)}（充值¥${recharge.toFixed(2)}+积分¥${gift.toFixed(2)}）`
                        : `¥${recharge.toFixed(2)}`;
                      console.log(`💰 余额: ${balanceStr}`);
                    } else {
                      // 按美元处理（默认 rate=500000）
                      const balance = (quota / 500000).toFixed(4);
                      balanceStr = `$${balance}`;
                      console.log(`💰 余额: ${balanceStr}`);
                    }
                  }
                }
              }

              await context.close();
              return { name: site.name, username: site.username, ok: checkinOk, msg, balance: balanceStr };
            } catch(e) {
              console.log(`❌❌❌ [${site.name}] ${site.username} 异常: ${e.message}`);
              return { name: site.name, username: site.username, ok: false, msg: e.message, balance: '' };
            }
          }

          async function main() {
            console.log('🚀 自动签到...');
            console.log(`⏰ 北京时间 ${new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'})}`);

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-blink-features=AutomationControlled', '--window-size=1920,1080']
            });

            const results = [];
            const batchSize = 10;
            for (let i = 0; i < SITES.length; i += batchSize) {
              const batch = SITES.slice(i, i + batchSize);
              const batchResults = await Promise.all(
                batch.map(site =>
                  site.style === 'new' ? checkinSiteNewStyle(browser, site) : checkinSite(browser, site)
                )
              );
              results.push(...batchResults);
            }

            await browser.close();

            const success = results.filter(r => r.ok).length;
            const failed = results.filter(r => !r.ok).length;
            console.log(`\n📊 签到完成: ✅ ${success} 成功, ❌ ${failed} 失败`);

            const failedList = results.filter(r => !r.ok);
            if (failedList.length > 0) {
              console.log('\n❌ 失败账号：');
              failedList.forEach(r => console.log(`  - [${r.name}] ${r.username}: ${r.msg}`));
            }

            const time = new Date().toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai'});
            let content = `## ⏰ ${time}\n\n| 站点 | 账号 | 签到 | 余额 |\n|---|---|---|---|\n`;
            for (const r of results) {
              const icon = r.ok ? '✅' : '❌';
              content += `| ${r.name} | ${r.username} | ${icon} ${r.msg} | ${r.balance} |\n`;
            }
            content += `\n**✅ ${success} 成功 / ❌ ${failed} 失败**`;

            if (failedList.length > 0) {
              content += '\n\n### ❌ 失败账号\n';
              failedList.forEach(r => {
                content += `- [${r.name}] ${r.username}: ${r.msg}\n`;
              });
            }

            await sendNotification(`🎯 签到报告 ${success}成功 ${failed}失败`, content);
          }

          main().catch(console.error);
          EOF
